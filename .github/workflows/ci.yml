name: CI

# Runs on every pull request into dev/main, and on pushes to those branches.
# Wire this up as a required status check in Settings -> Branches so a PR
# that fails here cannot be merged.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # prisma.config.ts reads DATABASE_URL. `prisma generate` never opens a
      # connection, so a placeholder is enough — CI does not touch a real DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
      # which catches a dependency added without committing the lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check migrations cover the schema
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && echo "migrations are in sync with schema.prisma"
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        continue-on-error: true

      # lint:check, not lint — the `lint` script carries --fix, which would
      # rewrite files in CI instead of reporting the problem.
      - name: Lint
        run: pnpm run lint:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
